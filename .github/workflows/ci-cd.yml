name: CI/CD Pipeline - TopBudget

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ===============================================
  # Job 1: Tests et Qualité Code
  # ===============================================
  test:
    name: 🧪 Tests & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Tests Backend
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Run Backend Tests
        working-directory: ./backend
        run: npm test -- --coverage --watchAll=false

      - name: 🔍 Backend Lint Check
        working-directory: ./backend
        run: npm run lint

      # Tests Frontend
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: 🧪 Run Frontend Tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false

      - name: 🔍 Frontend Lint Check
        working-directory: ./frontend
        run: npm run lint

      # Upload Coverage
      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          name: backend-coverage

  # ===============================================
  # Job 2: Build et Tests Docker
  # ===============================================
  docker-build:
    name: 🐳 Docker Build & Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image
      - name: 🏗️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: development
          push: false
          tags: topbudget-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend Image
      - name: 🏗️ Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: development
          push: false
          tags: topbudget-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test Docker Compose
      - name: 🧪 Test Docker Compose
        run: |
          cp .env.example .env
          docker-compose -f docker-compose.yml -f docker/docker-compose.test.yml up -d
          sleep 30
          
          # Test health endpoints
          curl -f http://localhost:5001/api/health/ready || exit 1
          curl -f http://localhost:3000/api/health || exit 1
          
          docker-compose down

  # ===============================================
  # Job 3: Sécurité et Vulnérabilités
  # ===============================================
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Scan Dependencies
      - name: 🔍 Run npm audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=moderate

      - name: 🔍 Run npm audit (Frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

      # Scan Docker Images
      - name: 🐳 Build images for scanning
        run: |
          docker build -t topbudget-backend:scan ./backend
          docker build -t topbudget-frontend:scan ./frontend

      - name: 🛡️ Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'topbudget-backend:scan'
          format: 'sarif'
          output: 'backend-trivy-results.sarif'

      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'backend-trivy-results.sarif'

  # ===============================================
  # Job 4: Build et Push Images Production
  # ===============================================
  build-push:
    name: 🚀 Build & Push Production Images
    runs-on: ubuntu-latest
    needs: [test, docker-build, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 📋 Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Backend
      - name: 🐳 Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend
      - name: 🐳 Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runner
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===============================================
  # Job 5: Déploiement Automatique
  # ===============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to production server
        run: |
          echo "🔄 Déploiement production simulé"
          echo "📦 Images construites et disponibles dans ghcr.io"
          echo "✅ Prêt pour déploiement manuel ou automatique"
          
          # Ici vous pourriez ajouter :
          # - Déploiement sur VPS via SSH
          # - Déploiement sur cloud provider
          # - Mise à jour de services existants

  # ===============================================
  # Job 6: Notification et Reporting
  # ===============================================
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test, docker-build, security, build-push]
    if: always()
    
    steps:
      - name: 📊 Pipeline Status Report
        run: |
          echo "## 📊 Pipeline Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Build**: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build & Push**: ${{ needs.build-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY