# ============================================
# Docker Compose - Configuration de base
# ============================================
# Ce fichier contient la configuration commune à tous les environnements
# Utilisé avec les overrides spécifiques : dev.yml, prod.yml, test.yml

services:
  # ============================================
  # Frontend Next.js
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - topbudget-network
    depends_on:
      - backend

  # ============================================  
  # Backend Node.js + TypeScript
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - topbudget-network
    depends_on:
      - mongo
    volumes:
      - logs-data:/app/logs

  # ============================================
  # Base de données MongoDB
  # ============================================  
  mongo:
    image: mongo:6-jammy
    networks:
      - topbudget-network
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=topbudget

volumes:
  mongo-data:
    name: topbudget_mongo_data
  logs-data:
    name: topbudget_logs_data

networks:
  topbudget-network:
    name: topbudget_network
    driver: bridge
