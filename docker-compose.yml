# ============================================
# Docker Compose - Configuration de base
# ============================================
# Ce fichier contient la configuration commune à tous les environnements
# Utilisé avec les overrides spécifiques : dev.yml, prod.yml, test.yml

services:
  # ============================================
  # Frontend Next.js
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - topbudget-network
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ============================================  
  # Backend Node.js + TypeScript
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - topbudget-network
    depends_on:
      - mongo
    volumes:
      - logs-data:/app/logs
      - ./backend/.env:/app/.env
    ports:
      - "5001:5001"

  # ============================================
  # Base de données MongoDB
  # ============================================  
  mongo:
    image: mongo:6-jammy
    networks:
      - topbudget-network
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=topbudget

  # ============================================
  # Mongo Express - Interface Web MongoDB
  # ============================================
  mongo-express:
    image: mongo-express:latest
    networks:
      - topbudget-network
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD:-devpassword}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true

volumes:
  mongo-data:
    name: topbudget_mongo_data
  logs-data:
    name: topbudget_logs_data

networks:
  topbudget-network:
    name: topbudget_network
    driver: bridge
